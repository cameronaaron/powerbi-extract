[project]
name = "powerbi-extract"
version = "0.2.0"
description = "Extract tabular data out of Power BI public-report visuals by replaying their querydata calls"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Cameron Aaron" }]
keywords = ["powerbi", "power-bi", "scraper", "etl", "data-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "polars>=1.0",
    "orjson>=3.9",
]

[project.urls]
Homepage = "https://github.com/cameronaaron/powerbi-extract"
Repository = "https://github.com/cameronaaron/powerbi-extract"
Issues = "https://github.com/cameronaaron/powerbi-extract/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
powerbi-extract-auto = "powerbi_extract.auto:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["powerbi_extract*"]

[tool.pytest.ini_options]
addopts = "--cov=powerbi_extract --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "BLE", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

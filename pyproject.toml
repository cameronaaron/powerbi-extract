[project]
name = "powerbi-extract"
version = "0.1.0"
description = "Extract tabular data out of Power BI public-report visuals by replaying their querydata calls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "polars>=1.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "maturin>=1.5,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["powerbi_extract*"]

[tool.pytest.ini_options]
addopts = "--cov=powerbi_extract --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
